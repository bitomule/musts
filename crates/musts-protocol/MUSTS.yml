version: 1

checks:
  # Scoped to the wire types. Without `paths:` the scope was the whole
  # crate folder, so anything dropped beside the source would reopen a
  # review that only ever reads lib.rs.
  #
  # Cargo.toml is not listed even though one fact is about dependencies:
  # `.mustsignore` excludes it workspace-wide, so the pattern could never
  # match. A new dependency still shows up in CI.
  contract:
    uses: agent
    paths:
      - "src/**"
    with:
      facts:
        - "musts-protocol contains only serde wire types and constants; any fn body beyond #[derive] machinery is justified or moved out."
        - "PROTOCOL_VERSION stays at 1 and no wire field has been added, renamed, or removed (or, if it has, the migration path is documented in the same change)."
        - "No new dependency has been introduced beyond serde and serde_json."
        - "No module performs I/O, validation, normalization, or transformation: the crate remains pure data."
