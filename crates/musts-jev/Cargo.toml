[package]
name = "musts-jev"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `uses: jev` capability for musts: ask a typed yes/no question about one file and branch on the answer."
homepage = "https://github.com/bitomule/musts"
keywords = ["musts", "jev", "validation", "agents", "developer-tools"]
categories = ["development-tools", "command-line-utilities"]
readme = "../../docs/examples/jev-check/EXAMPLE.md"

# Published separately from `musts` on purpose. Talking to jev means an HTTPS client, and
# that is ~47 crates including a TLS stack. Folding this into the `musts` binary would make
# every install pay for it, including the installs that will never ask jev anything. The
# capability is optional, so its cost is opt-in too: `cargo install musts-jev`.

[[bin]]
name = "musts-jev"
path = "src/main.rs"

[dependencies]
jevi = "0.1.2"
serde_json = { workspace = true }
