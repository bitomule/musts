name: jev
version: 0.2.0

# `musts-jev` ships with `musts`: `cargo install musts` puts both binaries on the same
# PATH. A judgment check nobody can find is a judgment check nobody uses, which is why it
# is not a separate crate. Build without it with `--no-default-features`.

# A thin wrapper over what jev already accepts: the repo writes the question, this sends one
# file and reads the verdict. It knows no domain. The rules that hold for every question —
# criteria mandatory, no numeric threshold anywhere, unsure is green, the green is never
# silent, silent in CI, and no gate — are enforced by the binary, not by this file.
#
# The state sent is `{path, source}` and nothing else. Anything that depends on execution
# cannot be judged this way: measured, jev abstains 100% of the time on those. A repo that
# needs computed facts should produce them with a `bash/check` and leave the result where its
# question can read it.

capabilities:
  check:
    uses: jev
    schema: schemas/jev.schema.json
    resolve:
      command: ["musts-jev", "resolve"]
    evidence:
      command: ["musts-jev", "evidence"]
