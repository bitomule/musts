[workspace]
resolver = "2"
members = [
    "crates/musts-protocol",
    "crates/musts-extension-util",
    "crates/musts-core",
    "crates/musts",
    "extensions/bazel-build",
    "extensions/mav-expect",
    "extensions/cargo",
    "tests/fixtures/stub_extension",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitomule/musts"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
ignore = "0.4"
globset = "0.4"
walkdir = "2"
fs2 = "0.4"
unicode-normalization = "0.1"
shell-words = "1"
mime_guess = "2"
jsonschema = { version = "0.46", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# Dev-only
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml", "json"] }
rstest = "0.26"
serial_test = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.27.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "bitomule/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Accept hand-patched `ci/` workflow: the ubuntu-20.04 runner used by
# cargo-dist 0.27's template has been retired by GitHub, so we bumped to
# ubuntu-22.04 manually. `dist init` with cargo-dist >= 0.28 will close
# this gap; until then `dist plan` skips its workflow-drift check.
allow-dirty = ["ci"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
