[workspace]
resolver = "2"
members = [
    "crates/harness-protocol",
    "crates/harness-extension-util",
    "crates/harness-core",
    "crates/harness",
    "extensions/bazel-build",
    "extensions/mav-expect",
    "extensions/cargo",
    "tests/fixtures/stub_extension",
]

[workspace.package]
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitomule/validator-claude"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
walkdir = "2"
fs2 = "0.4"
unicode-normalization = "0.1"
shell-words = "1"
mime_guess = "2"
jsonschema = { version = "0.18", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# Dev-only
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml", "json"] }
rstest = "0.21"
serial_test = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
