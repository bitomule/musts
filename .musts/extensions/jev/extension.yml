name: jev
version: 0.2.0

# `musts-jev` ships with `musts`, so a consumer that ran `cargo install musts` already has
# it on the same PATH. This repo points at its own build so the check works before the
# change is released.
capabilities:
  check:
    uses: jev
    schema: ../../../docs/examples/jev-check/schemas/jev.schema.json
    resolve:
      command: ["../../../target/release/musts-jev", "resolve"]
    evidence:
      command: ["../../../target/release/musts-jev", "evidence"]
