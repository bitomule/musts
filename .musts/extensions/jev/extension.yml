name: jev
version: 0.2.0

# This repo's own wiring of the capability. The commands point at the locally built binary;
# a consumer that installed it (`cargo install musts-jev`) writes just `musts-jev` instead.
capabilities:
  check:
    uses: jev
    schema: ../../../docs/examples/jev-check/schemas/jev.schema.json
    resolve:
      command: ["../../../target/debug/musts-jev", "resolve"]
    evidence:
      command: ["../../../target/debug/musts-jev", "evidence"]
