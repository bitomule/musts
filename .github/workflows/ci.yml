name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  e2e:
    name: cargo test (release, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build release binaries first so e2e tests that spawn workspace
      # binaries (e.g. stub-extension) find them at target/release/.
      - name: Build workspace (release)
        run: cargo build --workspace --release --locked
      - run: cargo test --workspace --release --test '*' --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove rust-toolchain override
        run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo build --workspace --locked

  # Advisory only. `musts validate` reads `.musts/ledger.lock.yaml` and
  # checks the per-scope hashes against the committed entries. The hash
  # uses `normalise_rel_path`, which lowercases on case-insensitive
  # filesystems (default macOS APFS) but not on case-sensitive ones
  # (default Linux ext4). A lock written from a macOS dev box therefore
  # carries hashes that CI on Linux cannot match — so we report the state
  # but don't fail the build. Local `make all` is still authoritative.
  dogfood:
    name: musts validate (self)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked
      - name: Wire cargo extension into local workspace
        run: |
          mkdir -p .musts/extensions/cargo
          ln -sf "$(pwd)/target/release/cargo-extension" \
                 .musts/extensions/cargo/cargo-extension
      - name: musts validate (advisory)
        run: ./target/release/musts validate || true
