[package]
name = "bazel-build-extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference bazel/build extension for the musts validation CLI."
publish = false

[[bin]]
name = "bazel-extension"
