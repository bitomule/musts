version: 1

checks:
  contract:
    uses: agent
    with:
      facts:
        - "The cargo extension never spawns cargo or any other process — it only reads asset paths the harness passes in the request."
        - "Resolve and evidence dispatch on request.capability and stay symmetric: every capability handled in resolve has its matching evidence branch."
        - "Heuristics treat empty, missing, or malformed logs as defensive rejection (kind+message); never panic, never unwrap."
        - "No global state, caches, or side effects outlive a single IPC call."
