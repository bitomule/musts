[package]
name = "cargo-extension"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference cargo/{fmt,clippy,test} extension for the harness validation CLI."

[[bin]]
name = "cargo-extension"
path = "src/main.rs"

[dependencies]
harness-protocol = { path = "../../crates/harness-protocol" }
harness-extension-util = { path = "../../crates/harness-extension-util" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
